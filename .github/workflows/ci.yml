name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Web types are current
        if: runner.os == 'Linux'
        run: |
          make web-types
          git diff --exit-code webui/src/generated

      - name: Build web UI
        run: make web-build

      - name: Install delta (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-delta

      - name: Install delta (macOS)
        if: runner.os == 'macOS'
        run: brew install git-delta

      - name: Test
        # make test runs the race packages, every other package, the server
        # package and the web unit tests side by side (scripts/test.sh). Each Go
        # step keeps -timeout=10m per package: CI runners' lower core counts
        # give concurrency-sensitive tests (e.g. pause/resume against a permit cap)
        # more room to legitimately run long; 2m and 5m both timed out on tests
        # that pass reliably (and fast) locally.
        run: make test

      - name: Build
        run: go build ./...

  web-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the browser
        run: |
          cd webui && pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Web e2e
        run: make web-e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-traces
          path: webui/test-results
          if-no-files-found: ignore

  herdr-e2e:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install herdr
        run: |
          brew update
          brew install herdr

      - name: Start herdr server
        run: |
          nohup herdr server > herdr-server.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            herdr status server --json >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "herdr server did not become ready in time" >&2
          cat herdr-server.log >&2
          exit 1

      - name: Update herdr agent detection manifests
        # A freshly-installed server may not have fetched the remote
        # detection manifests yet (see agentfake's working-title glyph,
        # only matched by claude.toml's osc_title_working rule) — refresh
        # synchronously instead of racing the background fetch.
        run: herdr server update-agent-manifests

      - name: Test
        env:
          GX_E2E: "1"
          HERDR_ENV: "1"
        run: go test ./e2e/... -timeout=6m

      - name: Upload herdr server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: herdr-server-log
          path: |
            herdr-server.log
            ~/.config/herdr/*.log
          include-hidden-files: true
          if-no-files-found: warn
