name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Web types are current
        if: runner.os == 'Linux'
        run: |
          make web-types
          git diff --exit-code webui/src/generated

      - name: Web tests
        run: make web-test

      - name: Build web UI
        run: make web-build

      - name: Install delta (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-delta

      - name: Install delta (macOS)
        if: runner.os == 'macOS'
        run: brew install git-delta

      - name: Test
        # make test runs the race packages, then every other package, then the
        # server package sharded across processes (scripts/test-shards.sh). Each
        # step keeps -timeout=10m per package/shard: CI runners' lower core counts
        # give concurrency-sensitive tests (e.g. pause/resume against a permit cap)
        # more room to legitimately run long; 2m and 5m both timed out on tests
        # that pass reliably (and fast) locally.
        # A commit's detached auto maintenance can outlive a test and break
        # its t.TempDir cleanup; testutil's init sets the same for local runs.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: "false"
        run: make test

      - name: Build
        run: go build ./...

  herdr-e2e:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install herdr
        run: |
          brew update
          brew install herdr

      - name: Start herdr server
        run: |
          nohup herdr server > herdr-server.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            herdr status server --json >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "herdr server did not become ready in time" >&2
          cat herdr-server.log >&2
          exit 1

      - name: Update herdr agent detection manifests
        # A freshly-installed server may not have fetched the remote
        # detection manifests yet (see agentfake's working-title glyph,
        # only matched by claude.toml's osc_title_working rule) — refresh
        # synchronously instead of racing the background fetch.
        run: herdr server update-agent-manifests

      - name: Test
        env:
          GX_E2E: "1"
          HERDR_ENV: "1"
        run: go test ./e2e/... -timeout=6m

      - name: Upload herdr server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: herdr-server-log
          path: |
            herdr-server.log
            ~/.config/herdr/*.log
          include-hidden-files: true
          if-no-files-found: warn
