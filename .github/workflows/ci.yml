name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install delta (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-delta

      - name: Install delta (macOS)
        if: runner.os == 'macOS'
        run: brew install git-delta

      - name: Test
        # -timeout=5m: matches the Makefile test target — still fails a truly
        # hung test well before the job's overall time limit, but leaves
        # headroom for CI runners' lower core counts, where concurrency-
        # sensitive tests (e.g. park/resume against a permit cap) can
        # legitimately take longer than on a local dev machine. 2m proved too
        # tight and produced runner-only timeout failures on tests that pass
        # reliably (and fast) locally.
        run: go test ./... -timeout=5m

      - name: Build
        run: go build ./...
