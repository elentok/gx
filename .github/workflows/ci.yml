name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install delta (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-delta

      - name: Install delta (macOS)
        if: runner.os == 'macOS'
        run: brew install git-delta

      - name: Test
        # -timeout=5m: matches the Makefile test target — still fails a truly
        # hung test well before the job's overall time limit, but leaves
        # headroom for CI runners' lower core counts, where concurrency-
        # sensitive tests (e.g. park/resume against a permit cap) can
        # legitimately take longer than on a local dev machine. 2m proved too
        # tight and produced runner-only timeout failures on tests that pass
        # reliably (and fast) locally.
        run: go test ./... -timeout=5m

      - name: Build
        run: go build ./...

  herdr-e2e:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install herdr
        run: |
          brew update
          brew install herdr

      - name: Start herdr server
        run: |
          nohup herdr server > herdr-server.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            herdr status server --json >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "herdr server did not become ready in time" >&2
          cat herdr-server.log >&2
          exit 1

      - name: Update herdr agent detection manifests
        # A freshly-installed server may not have fetched the remote
        # detection manifests yet (see agentfake's working-title glyph,
        # only matched by claude.toml's osc_title_working rule) — refresh
        # synchronously instead of racing the background fetch.
        run: herdr server update-agent-manifests

      - name: Test
        env:
          HERDR_ENV: "1"
        run: go test ./e2e/... -timeout=2m
