name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Web types are current
        if: runner.os == 'Linux'
        run: |
          make web-types
          git diff --exit-code webui/src/generated

      - name: Build web UI
        run: make web-build

      - name: Web lint
        if: runner.os == 'Linux'
        run: make web-lint

      - name: Install delta (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-delta

      - name: Install delta (macOS)
        if: runner.os == 'macOS'
        run: brew install git-delta

      - name: Test
        # make test runs the race packages, every other package, the server
        # package and the web unit tests side by side, then the 240-process burst
        # test alone as the last step (scripts/test.sh). Each Go
        # step keeps -timeout=10m per package: CI runners' lower core counts
        # give concurrency-sensitive tests (e.g. pause/resume against a permit cap)
        # more room to legitimately run long; 2m and 5m both timed out on tests
        # that pass reliably (and fast) locally.
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
        run: make test

      - name: Upload go test JSON
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-json-${{ matrix.os }}
          path: ${{ runner.temp }}/xdg-data/gx/brief/*-go-test.log
          if-no-files-found: ignore

      - name: Build
        run: go build ./...

  web-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the browser
        run: |
          cd webui && pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Web e2e
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          GX_BRIEF_KEEP_REPORT: "1"
        run: make web-e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-traces
          path: webui/test-results
          if-no-files-found: ignore

      - name: Upload Playwright JSON report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json
          path: ${{ runner.temp }}/xdg-data/gx/brief/*-playwright.json
          if-no-files-found: ignore
