<!-- Standard mock variant switcher. Copy this whole block into the mock; it needs nothing else.
     Mark each variant as an element with data-v (a short key, e.g. "A") and data-name (a label):
       <section data-v="A" data-name="Dense list">...</section>
     The script shows one at a time with the hidden attribute. Do not set display on them
     without a [hidden]{display:none} rule. The chosen variant lives in the URL hash (#v=A),
     so reload and shared links keep it. -->
<style>
.mk-sw{position:fixed;z-index:2147483000;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:stretch;gap:2px;
  background:#f4f4f5;color:#18181b;border:2px solid #18181b;border-radius:999px;padding:4px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);font:600 14px/1 ui-sans-serif,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;max-width:calc(100vw - 16px)}
.mk-sw button{all:unset;box-sizing:border-box;cursor:pointer;min-width:48px;min-height:48px;display:grid;place-items:center;
  border-radius:999px;font-size:20px;touch-action:manipulation}
.mk-sw button:active{background:#d4d4d8}
.mk-sw button:focus-visible{outline:3px solid #2563eb;outline-offset:1px}
.mk-sw .mk-label{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;
  padding:0 12px;min-width:112px;max-width:220px;text-align:center}
.mk-sw .mk-label b{font-size:15px}
.mk-sw .mk-label small{font:500 11px/1 ui-sans-serif,system-ui,sans-serif;color:#52525b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mk-sw .mk-tag{align-self:center;background:#18181b;color:#f4f4f5;border-radius:999px;padding:5px 8px;font-size:10px;letter-spacing:.08em;margin:0 4px 0 8px}
</style>

<div class="mk-sw" id="mk-sw" role="group" aria-label="Mock variants">
  <button class="prev" aria-label="Previous variant">‹</button>
  <div class="mk-label" aria-live="polite"><b></b><small></small></div>
  <button class="next" aria-label="Next variant">›</button>
  <span class="mk-tag">MOCK</span>
</div>

<script>
(function(){
  var vs=[].slice.call(document.querySelectorAll('[data-v]')),sw=document.getElementById('mk-sw');
  var lab=sw.querySelector('.mk-label');
  function key(){var m=/(?:^#|&)v=([^&]*)/.exec(location.hash);return m?decodeURIComponent(m[1]):''}
  function idx(){var c=key();for(var i=0;i<vs.length;i++)if(vs[i].dataset.v===c)return i;return 0}
  function render(){
    var i=idx();
    vs.forEach(function(v,j){v.hidden=j!==i});
    lab.querySelector('b').textContent=(i+1)+' of '+vs.length;
    lab.querySelector('small').textContent=vs[i].dataset.name||vs[i].dataset.v;
  }
  function step(d){location.hash='v='+encodeURIComponent(vs[(idx()+d+vs.length)%vs.length].dataset.v)}
  sw.querySelector('.prev').onclick=function(){step(-1)};
  sw.querySelector('.next').onclick=function(){step(1)};
  document.addEventListener('keydown',function(e){
    var t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
    if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)});
  window.addEventListener('hashchange',render);
  if(vs.length)render();
})();
</script>
