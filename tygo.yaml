# Generates the web UI's view of the server wire types: `make web-types`.
packages:
  - path: "github.com/elentok/gx/server"
    output_path: "webui/src/generated/server.ts"
    include_files:
      - budget.go
      - designs.go
      - detail.go
      - detailrelated.go
      - detailruns.go
      - epiccard.go
      - epicdetail.go
      - epiclist.go
      - limitburn.go
      - epicsummary.go
      - fixagent.go
      - harnesslabel.go
      - index.go
      - pause.go
      - projectworktrees.go
      - recentlyfinished.go
      - stats.go
      - statsgrilling.go
      - statslimitburn.go
      - limitsstore.go
      - migrate.go
      - limitsevents.go
      - usagesample.go
      - usagesummary.go
      - verdicts.go
    # Moved types stay importable from generated/server. A wire type the
    # remaining server types use needs an import here and a type_mappings entry
    # below (tygo loads syntax only, so it cannot resolve wire.X itself).
    frontmatter: |
      export * from './wire';
      import type { DiskStatus, Health, SessionInfo, SessionResult } from './wire';
    type_mappings:
      time.Time: "string"
      tickets.DesignStep: "string"
      wire.DiskStatus: "DiskStatus"
      wire.Health: "Health"
      wire.SessionInfo: "SessionInfo"
      wire.SessionResult: "SessionResult"
    enum_style: "union"
  # tygo writes each package to its own file (one output_path per package, no
  # merging), so wire has its own file; server.ts re-exports it.
  - path: "github.com/elentok/gx/server/wire"
    output_path: "webui/src/generated/wire.ts"
    include_files:
      - checkstatus.go
      - diskcleannow.go
      - diskwatch.go
      - healthreport.go
      - healthtypes.go
      - restart.go
      - restartcheck.go
      - sessionautoadvance.go
      - sessionchat.go
      - sessioncommands.go
      - sessionfailure.go
      - sessionfocus.go
      - sessionkeys.go
      - sessionpermission.go
      - sessionprompt.go
      - sessionround.go
      - sessionscreen.go
      - sessionstate.go
      - sessions.go
      - sessiontypes.go
    type_mappings:
      time.Time: "string"
      tickets.DesignStep: "string"
    enum_style: "union"
