# Generates the web UI's view of the server wire types: `make web-types`.
packages:
  - path: "github.com/elentok/gx/server/wire"
    output_path: "webui/src/generated/server.ts"
    include_files:
      - checkstatus.go
      - designs.go
      - detail.go
      - diskwatch.go
      - epicdetail.go
      - epiclist.go
      - fixagent.go
      - healthreport.go
      - index.go
      - limitburn.go
      - limitsstore.go
      - migrate.go
      - pause.go
      - projectworktrees.go
      - recentlyfinished.go
      - restart.go
      - sessions.go
      - sessiontypes.go
      - stats.go
      - usagesummary.go
      - verdicts.go
    type_mappings:
      time.Time: "string"
      tickets.DesignStep: "string"
    enum_style: "union"
