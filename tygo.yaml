# Generates the web UI's view of the server wire types: `make web-types`.
packages:
  - path: "github.com/elentok/gx/server/wire"
    output_path: "webui/src/generated/server.ts"
    frontmatter: |
      export * from './ops';
      export * from './subagent';
      import type { SessionSubagent } from './subagent';
    include_files:
      - archivedlist.go
      - backlog.go
      - checkstatus.go
      - designs.go
      - detail.go
      - devstatus.go
      - diff.go
      - diskwatch.go
      - epicdetail.go
      - epiclist.go
      - fixagent.go
      - healthreport.go
      - index.go
      - initiatives.go
      - limitburn.go
      - limitsstore.go
      - queue.go
      - rest.go
      - sessions.go
      - sessiontypes.go
      - startdesign.go
      - stats.go
      - targets.go
      - usagesummary.go
      - verdicts.go
      - workspaces.go
    type_mappings:
      time.Time: "string"
      json.RawMessage: "unknown"
      subagent.SessionSubagent: "SessionSubagent"
      agent.ContextLevel: '"green" | "yellow" | "orange" | "red"'
      agent.Tier: '"light" | "worker" | "strongest"'
    enum_style: "union"
  - path: "github.com/elentok/gx/server/wire/subagent"
    output_path: "webui/src/generated/subagent.ts"
    include_files:
      - subagent.go
    type_mappings:
      time.Time: "string"
    enum_style: "union"
  - path: "github.com/elentok/gx/server/wire/ops"
    output_path: "webui/src/generated/ops.ts"
    frontmatter: "import type { HealthReason, HealthState, MapStep } from './server';"
    include_files:
      - brokenrules.go
      - chatdrafts.go
      - cleanup.go
      - designdrafts.go
      - drafthistory.go
      - healthreport.go
      - hostedfiles.go
      - migrate.go
      - restart.go
      - schedules.go
      - settingspage.go
      - triage.go
    type_mappings:
      time.Time: "string"
      json.RawMessage: "unknown"
    enum_style: "union"
