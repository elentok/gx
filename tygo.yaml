# Generates the web UI's view of the server wire types: `make web-types`.
packages:
  - path: "github.com/elentok/gx/server/wire"
    output_path: "webui/src/generated/server.ts"
    include_files:
      - archivedlist.go
      - checkstatus.go
      - cleanup.go
      - designdrafts.go
      - designs.go
      - detail.go
      - devstatus.go
      - diskwatch.go
      - epicdetail.go
      - epiclist.go
      - fixagent.go
      - healthreport.go
      - index.go
      - limitburn.go
      - limitsstore.go
      - migrate.go
      - recentlyfinished.go
      - restart.go
      - sessions.go
      - sessiontypes.go
      - settingspage.go
      - stats.go
      - targets.go
      - triage.go
      - usagesummary.go
      - verdicts.go
      - workspaces.go
    type_mappings:
      time.Time: "string"
      json.RawMessage: "unknown"
      agent.ContextLevel: '"green" | "yellow" | "orange" | "red"'
      agent.Tier: '"light" | "worker" | "strongest"'
    enum_style: "union"
