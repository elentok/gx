# Generates the web UI's view of the server wire types: `make web-types`.
packages:
  - path: "github.com/elentok/gx/server"
    output_path: "webui/src/generated/server.ts"
    include_files:
      - budget.go
      - checkstatus.go
      - designs.go
      - detail.go
      - diskcleannow.go
      - diskwatch.go
      - detailrelated.go
      - detailruns.go
      - epiccard.go
      - epicdetail.go
      - epiclist.go
      - epicsummary.go
      - fixagent.go
      - harnesslabel.go
      - healthreport.go
      - healthtypes.go
      - index.go
      - pause.go
      - projectworktrees.go
      - recentlyfinished.go
      - sessionautoadvance.go
      - sessionchat.go
      - sessionfailure.go
      - sessionfocus.go
      - sessionprompt.go
      - sessionround.go
      - sessionscreen.go
      - sessionstate.go
      - sessions.go
      - sessiontypes.go
      - stats.go
      - statsgrilling.go
      - usagesample.go
      - verdicts.go
    type_mappings:
      time.Time: "string"
      tickets.DesignStep: "string"
    enum_style: "union"
